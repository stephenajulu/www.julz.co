<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | JULZ Sovereign Tech Forge</title>
  
  <!-- Load Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Custom Dark Theme Styles for Decap CMS UI Dashboard -->
  <style>
    body {
      background-color: #030008 !important;
      color: #ffffff !important;
    }
    
    #nc-root {
      background-color: #030008 !important;
    }

    /* Navigation Bar */
    div[class*="AppHeaderContainer"],
    header[class*="AppHeader"] {
      background-color: rgba(255, 255, 255, 0.02) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
    }

    /* Sidebar Container */
    aside,
    div[class*="SidebarContainer"] {
      background-color: #030008 !important;
      border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    div[class*="SidebarHeading"] {
      color: rgba(255, 255, 255, 0.5) !important;
      font-size: 0.8rem !important;
      text-transform: uppercase !important;
      letter-spacing: 0.5px !important;
    }

    a[class*="SidebarLink"] {
      color: rgba(255, 255, 255, 0.7) !important;
      border-left-width: 3px !important;
      transition: all 0.2s ease !important;
    }

    a[class*="SidebarLink"]:hover {
      color: #ffffff !important;
      background-color: rgba(255, 255, 255, 0.02) !important;
    }

    a[class*="SidebarLinkActive"] {
      color: #ffffff !important;
      background-color: rgba(84, 43, 255, 0.12) !important;
      border-left-color: #542bff !important;
    }

    /* Content Cards */
    div[class*="Card"],
    div[class*="CollectionCard"] {
      background: rgba(255, 255, 255, 0.02) !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      border-radius: 8px !important;
      color: #ffffff !important;
      box-shadow: none !important;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    div[class*="Card"]:hover,
    div[class*="CollectionCard"]:hover {
      border-color: rgba(84, 43, 255, 0.4) !important;
      background: rgba(255, 255, 255, 0.04) !important;
    }

    /* Form Fields and Labels */
    div[class*="ControlContainer"] {
      background: rgba(255, 255, 255, 0.01) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 8px !important;
      padding: 1.5em !important;
      margin-bottom: 1.5em !important;
      box-shadow: none !important;
    }

    label[class*="ControlLabel"] {
      color: rgba(255, 255, 255, 0.8) !important;
      font-size: 0.85rem !important;
      font-weight: 600 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.75px !important;
      margin-bottom: 0.75em !important;
    }

    /* Form Widgets (Inputs) */
    input, 
    textarea, 
    select {
      background-color: rgba(255, 255, 255, 0.02) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 6px !important;
      color: #ffffff !important;
      padding: 0.75em 1em !important;
      outline: none !important;
      box-sizing: border-box !important;
      transition: all 0.3s ease !important;
    }

    input:focus, 
    textarea:focus, 
    select:focus {
      border-color: rgba(84, 43, 255, 0.5) !important;
      box-shadow: 0 0 10px rgba(84, 43, 255, 0.15) !important;
      background-color: rgba(255, 255, 255, 0.04) !important;
    }

    /* Buttons */
    button,
    button[class*="Button"] {
      background: #542bff !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 6px !important;
      padding: 0.6em 1.5em !important;
      font-weight: 500 !important;
      cursor: pointer !important;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    button:hover {
      background: #6320d6 !important;
      box-shadow: 0 4px 12px rgba(84, 43, 255, 0.3) !important;
    }

    button[class*="PublishButton"] {
      background-color: #00e676 !important;
      color: #030008 !important;
      font-weight: 600 !important;
    }

    button[class*="PublishButton"]:hover {
      background-color: #00c853 !important;
      box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3) !important;
    }

    /* Editor Layout Pane */
    div[class*="EditorContainer"] {
      background-color: #030008 !important;
    }

    /* Preview Iframe Pane */
    div[class*="PreviewPaneFrame"] {
      background-color: #030008 !important;
      border-left: 1px solid rgba(255, 255, 255, 0.08) !important;
    }
  </style>
</head>
<body>
  <!-- Decap CMS Script Execution and Preview Registering -->
  <script>
    // Register the compiled main styling to style the preview iframe
    CMS.registerPreviewStyle("/css/main.6f67ca69d8907877b877b563a435e638bab0118317521fffb456d3ae71f8b0f3.css");
  </script>
</body>
</html>
