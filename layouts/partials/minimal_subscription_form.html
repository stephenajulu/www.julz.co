<form class="newsletter-form newsletter-form--minimal" name="newsletter" method="POST" data-netlify="true">
  <div class="newsletter-form__group">
    <input type="email" name="email" class="newsletter-form__input" placeholder="Enter your email..." required aria-label="Email Address" />
    <button type="submit" class="newsletter-form__button" aria-label="Subscribe">
      <svg class="icon-paper-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</form>
